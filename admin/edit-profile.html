<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기본 정보 편집</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="admin-header-content">
            <h1>기본 정보 편집</h1>
            <button id="logout-btn" class="btn secondary">로그아웃</button>
        </div>
    </header>
    
    <div class="admin-container">
        <div class="admin-nav">
            <h2>관리 메뉴</h2>
            <ul>
                <li><a href="dashboard.html">대시보드</a></li>
                <li><a href="edit-profile.html" class="active">기본 정보 편집</a></li>
                <li><a href="edit-about.html">소개 페이지 편집</a></li>
                <li><a href="../index.html" target="_blank">웹사이트 보기</a></li>
            </ul>
        </div>
        
        <div class="admin-content">
            <form id="profile-form" class="admin-form">
                <section class="form-section">
                    <h2>기본 정보</h2>
                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="title">직함/소개</label>
                        <input type="text" id="title" name="title" required>
                    </div>
                    <div class="form-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </section>
                
                <section class="form-section">
                    <h2>소셜 링크</h2>
                    <div class="form-group">
                        <label for="github">GitHub</label>
                        <input type="url" id="github" name="github" placeholder="https://github.com/yourusername">
                    </div>
                    <div class="form-group">
                        <label for="linkedin">LinkedIn</label>
                        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                    </div>
                </section>
                
                <section class="form-section">
                    <h2>스킬</h2>
                    <div id="skills-container">
                        <!-- 스킬 카테고리 항목들이 여기에 추가됩니다 -->
                    </div>
                    <button type="button" id="add-skill-category-btn" class="btn secondary">스킬 카테고리 추가</button>
                </section>
                
                <button type="submit" class="btn primary save-btn">저장하기</button>
            </form>
        </div>
    </div>
    
    <script src="../js/admin.js"></script>
</body>
</html>
