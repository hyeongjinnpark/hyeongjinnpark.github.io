<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개 페이지 편집</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="admin-header-content">
            <h1>소개 페이지 편집</h1>
            <button id="logout-btn" class="btn secondary">로그아웃</button>
        </div>
    </header>
    
    <div class="admin-container">
        <div class="admin-nav">
            <h2>관리 메뉴</h2>
            <ul>
                <li><a href="dashboard.html">대시보드</a></li>
                <li><a href="edit-profile.html">기본 정보 편집</a></li>
                <li><a href="edit-about.html" class="active">소개 페이지 편집</a></li>
                <li><a href="../index.html" target="_blank">웹사이트 보기</a></li>
            </ul>
        </div>
        
        <div class="admin-content">
            <form id="about-form" class="admin-form">
                <section class="form-section">
                    <h2>자기소개</h2>
                    <div class="form-group">
                        <label for="about-text">소개 글 (문단은 빈 줄로 구분)</label>
                        <textarea id="about-text" name="about-text" rows="8" required></textarea>
                    </div>
                </section>
                
                <section class="form-section">
                    <h2>경력</h2>
                    <div id="experience-container">
                        <!-- 경력 항목들이 여기에 추가됩니다 -->
                    </div>
                    <button type="button" class="btn secondary" onclick="addExperienceField(document.getElementById('experience-container'))">경력 항목 추가</button>
                </section>
                
                <section class="form-section">
                    <h2>프로젝트</h2>
                    <div id="projects-container">
                        <!-- 프로젝트 항목들이 여기에 추가됩니다 -->
                    </div>
                    <button type="button" class="btn secondary" onclick="addProjectField(document.getElementById('projects-container'))">프로젝트 항목 추가</button>
                </section>
                
                <section class="form-section">
                    <h2>학력</h2>
                    <div id="education-container">
                        <!-- 학력 항목들이 여기에 추가됩니다 -->
                    </div>
                    <button type="button" class="btn secondary" onclick="addEducationField(document.getElementById('education-container'))">학력 항목 추가</button>
                </section>
                
                <section class="form-section">
                    <h2>자격증 및 수상</h2>
                    <div id="certifications-container">
                        <!-- 자격증 항목들이 여기에 추가됩니다 -->
                    </div>
                    <button type="button" class="btn secondary" onclick="addCertificationField(document.getElementById('certifications-container'))">자격증 항목 추가</button>
                </section>
                
                <button type="submit" class="btn primary save-btn">저장하기</button>
            </form>
        </div>
    </div>
    
    <script src="../js/admin.js"></script>
</body>
</html>
