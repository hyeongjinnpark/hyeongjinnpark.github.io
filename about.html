<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개 - 내 이력서</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">내 이름</div>
            <ul class="nav-links">
                <li><a href="index.html">홈</a></li>
                <li><a href="about.html" class="active">소개</a></li>
                <li><a href="cv.html">이력서</a></li>
            </ul>
        </nav>
    </header>
    
    <main class="container">
        <section class="about-section">
            <h1>나에 대하여</h1>
            <div class="about-content">
                <div class="about-image">
                    <!-- 추후 본인 이미지로 교체 -->
                    <div class="placeholder-image">프로필 이미지</div>
                </div>
                <div class="about-text">
                    <!-- 관리자에서 편집한 내용이 표시됩니다 -->
                </div>
            </div>
        </section>
        
        <section class="skills-section">
            <h2>기술 역량</h2>
            <div class="skills-grid">
                <!-- 관리자에서 편집한 스킬이 표시됩니다 -->
            </div>
        </section>
        
        <section class="projects-section">
            <h2>주요 프로젝트</h2>
            <div class="projects-grid">
                <!-- 관리자에서 편집한 프로젝트가 표시됩니다 -->
            </div>
        </section>
        
        <section class="experience-section">
            <h2>경력 사항</h2>
            <div class="timeline">
                <!-- 관리자에서 편집한 경력이 표시됩니다 -->
            </div>
        </section>
        
        <section class="education-section">
            <h2>학력</h2>
            <div class="education-items">
                <!-- 관리자에서 편집한 학력이 표시됩니다 -->
            </div>
        </section>
        
        <section class="certifications-section">
            <h2>자격증 및 수상</h2>
            <ul class="certifications-list">
                <!-- 관리자에서 편집한 자격증이 표시됩니다 -->
            </ul>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 내 이름. 모든 권리 보유.</p>
        <div class="social-links">
            <a href="https://github.com/yourusername" target="_blank">GitHub</a>
            <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
            <a href="mailto:your.email@example.com">이메일</a>
        </div>
    </footer>
    
    <script src="js/main.js"></script>

</html>
